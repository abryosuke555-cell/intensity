<!DOCTYPE html>
<html lang="ja">

<head>
    <title>計測震度データベース</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-GRQELX997W"></script>
    <script>
        window.dataLayer = window.dataLayer || [];

        function gtag() {
            dataLayer.push(arguments);
        }

        gtag('js', new Date());
        gtag('config', 'G-GRQELX997W');
    </script>

    <link rel="stylesheet" href="css/uikit.min.css">
    <link href="css/maplibre-gl.css" rel="stylesheet">

    <style>
        html,
        body,
        #map {
            height: 100%;
            margin: 0;
        }

        .maplibregl-popup {
            z-index: 71;
        }

        /* 左側ボタン */
        .btn {
            position: fixed;
            z-index: 1000;
            left: 15px;

            width: 42px;
            height: 42px;

            border-radius: 12px;

            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(0, 0, 0, 0.12);

            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.18);

            transition:
                transform 0.15s ease,
                box-shadow 0.15s ease,
                background 0.15s ease;
        }

        .btn:hover {
            transform: scale(1.05);
            background: #ffffff;
            box-shadow: 0 5px 14px rgba(0, 0, 0, 0.25);
        }

        .btn:active {
            transform: scale(0.95);
        }

        #zoominbtn {
            top: 15px;
        }

        #zoomoutbtn {
            top: 65px;
        }

        #sharebtn {
            top: 115px;
        }

        #dbbtn {
            top: 165px;
        }

        #pdfbtn {
            top: 215px;
        }

        #infobtn {
            top: 265px;
        }

        #iconbtn {
            top: 315px;
        }

        #listbtn {
            top: 365px;
        }

        /* 地震情報モーダル */
        #info-modal .uk-modal-dialog {
            border-radius: 14px;
            overflow: hidden;
        }

        #info-modal .uk-modal-body {
            padding: 25px;
        }

        /* モーダルタイトル */
        .modal-title {
            margin: 0 0 20px 0;
            font-size: 24px;
            font-weight: 700;
        }

        /* 地震概要カード */
        .earthquake-summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .summary-item {
            padding: 14px;
            border-radius: 10px;
            background: #f5f7fa;
            border: 1px solid #e5e7eb;
        }

        .summary-label {
            display: block;
            font-size: 12px;
            color: #777;
            margin-bottom: 5px;
        }

        .summary-value {
            display: block;
            font-size: 17px;
            font-weight: 600;
            color: #222;
        }

        /* マグニチュード */
        .magnitude-value {
            font-size: 22px;
            font-weight: 700;
        }

        /* 震度表 */
        #table-intensities tr {
            border-bottom: 1px solid #e5e5e5;
        }

        /* グラフ */
        .chart-container {
            margin-top: 25px;
        }

        .chart-container h3 {
            font-size: 18px;
            font-weight: 600;
        }

        /* スマートフォン */
        @media (max-width: 700px) {
            .earthquake-summary {
                grid-template-columns: repeat(2, 1fr);
            }

            .modal-title {
                font-size: 20px;
            }

            .summary-value {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <div id="map"></div>

    <!-- 地図操作 -->
    <a id="zoominbtn"
       onclick="map.setZoom(map.getZoom() + 0.5);"
       class="uk-icon-button btn"
       uk-icon="plus"
       uk-tooltip="title: 拡大; pos: right">
    </a>

    <a id="zoomoutbtn"
       onclick="map.setZoom(map.getZoom() - 0.5);"
       class="uk-icon-button btn"
       uk-icon="minus"
       uk-tooltip="title: 縮小; pos: right">
    </a>

    <!-- リンクコピー -->
    <a id="sharebtn"
       onclick="navigator.clipboard.writeText(location.href);"
       class="uk-icon-button btn"
       uk-icon="link"
       uk-tooltip="title: リンクをコピー; pos: right">
    </a>

    <!-- 気象庁 -->
    <a id="dbbtn"
       href=""
       class="uk-icon-button btn"
       uk-icon="database"
       uk-tooltip="title: 気象庁 震度データベースに移動; pos: right">
    </a>

    <!-- PDF -->
    <a id="pdfbtn"
       href=""
       class="uk-icon-button btn"
       uk-icon="file-pdf"
       uk-tooltip="title: 地震・火山月報のPDFに移動; pos: right">
    </a>

    <!-- 情報 -->
    <a id="infobtn"
       uk-toggle="target: #info-modal"
       class="uk-icon-button btn"
       uk-icon="info"
       uk-tooltip="title: 地震の情報; pos: right">
    </a>

    <!-- 震度配色切り替え -->
    <a id="iconbtn"
       onclick="
            if (document.cookie.includes('icon=jma')) {
                document.cookie = document.cookie.replace('icon=jma', 'icon=kmoni');
            } else {
                document.cookie = document.cookie.replace('icon=kmoni', 'icon=jma');
            }
            document.location.reload();
       "
       class="uk-icon-button btn"
       uk-icon="image"
       uk-tooltip="title: 震度配色を切り替え<br>(気象庁/強震モニタ); pos: right">
    </a>

    <!-- リストへ戻る -->
    <a id="listbtn"
       href=""
       class="uk-icon-button btn"
       uk-icon="list"
       uk-tooltip="title: リストに戻る; pos: right">
    </a>


    <!-- 地震情報 -->
    <div id="info-modal"
         class="uk-modal-container"
         uk-modal>

        <div class="uk-modal-dialog uk-modal-body"
             uk-overflow-auto
             style="height: 100%;">

            <button class="uk-modal-close-default"
                    type="button"
                    uk-close>
            </button>

            <div id="modalbody"
                 class="uk-modal-body">

                <h2 class="modal-title">
                    地震情報
                </h2>

                <ul class="uk-margin-remove"
                    uk-tab="connect: #tab-content">

                    <li class="uk-active uk-padding-remove">
                        <a href="#">概要</a>
                    </li>

                    <li class="uk-padding-remove">
                        <a href="#">計測震度－震央距離分布</a>
                    </li>

                </ul>


                <div id="tab-content"
                     class="uk-switcher uk-margin-small-top">

                    <!-- 概要 -->
                    <div>

                        <!-- 地震概要 -->
                        <div class="earthquake-summary">

                            <div class="summary-item">
                                <span class="summary-label">
                                    発生日時
                                </span>

                                <span class="summary-value"
                                      id="summary-time">
                                </span>
                            </div>


                            <div class="summary-item">
                                <span class="summary-label">
                                    震央地名
                                </span>

                                <span class="summary-value"
                                      id="summary-epicenter">
                                </span>
                            </div>


                            <div class="summary-item">
                                <span class="summary-label">
                                    マグニチュード
                                </span>

                                <span class="summary-value magnitude-value"
                                      id="summary-magnitude">
                                </span>
                            </div>


                            <div class="summary-item">
                                <span class="summary-label">
                                    深さ
                                </span>

                                <span class="summary-value"
                                      id="summary-depth">
                                </span>
                            </div>


                            <div class="summary-item">
                                <span class="summary-label">
                                    緯度
                                </span>

                                <span class="summary-value"
                                      id="summary-latitude">
                                </span>
                            </div>


                            <div class="summary-item">
                                <span class="summary-label">
                                    経度
                                </span>

                                <span class="summary-value"
                                      id="summary-longitude">
                                </span>
                            </div>

                        </div>


                        <!-- 元の地震情報テーブル -->
                        <table class="uk-table uk-table-small uk-table-striped">

                            <thead>
                                <tr>
                                    <th>地震の発生日時</th>
                                    <th>震央地名</th>
                                    <th>緯度</th>
                                    <th>経度</th>
                                    <th>深さ</th>
                                    <th>M</th>
                                </tr>
                            </thead>

                            <tbody id="table-earthquakes">
                            </tbody>

                        </table>


                        <div id="notes">
                        </div>


                        <!-- 計測震度 -->
                        <div>

                            <h3>
                                観測された計測震度
                            </h3>

                            <table class="uk-table uk-table-small uk-table-striped">

                                <thead>
                                    <tr>
                                        <th class="uk-width-1-6">
                                            都道府県
                                        </th>

                                        <th class="uk-width-1-6">
                                            震度
                                        </th>

                                        <th class="uk-width-2-3">
                                            観測点名・計測震度
                                        </th>
                                    </tr>
                                </thead>

                                <tbody id="table-intensities">
                                </tbody>

                            </table>

                        </div>

                    </div>


                    <!-- グラフ -->
                    <div>

                        <div class="chart-container">

                            <h3>
                                計測震度－震央距離分布
                            </h3>

                            <canvas id="seismicCanvas"
                                    width="800"
                                    height="500">
                            </canvas>

                        </div>

                    </div>

                </div>

            </div>


            <p class="uk-text-muted">

                気象庁の発表時の情報を掲載しています。
                情報は精査後更新されている場合があります。
                <br>

                情報の正確性は保証しません。
                不正確なデータを確認した場合は

                <a href="https://forms.gle/hewkCjRMcgYUGxmH6">
                    こちらのフォーム
                </a>

                からご報告ください。

            </p>

        </div>

    </div>


    <!-- JavaScript -->

    <script src="js/uikit.min.js"></script>
    <script src="js/uikit-icons.min.js"></script>

    <script src="js/maplibre-gl.js"></script>

    <script src="js/pmtiles.js"></script>

    <script src="js/stations.js"></script>

    <script src="js/SeismicScatterPlot.js"></script>

    <script src="js/map.js"></script>


    <!-- 地震概要表示 -->
    <script>

        /*
         * 地震情報が既存のtable-earthquakesへ
         * 書き込まれた後に、概要カードにも
         * 同じ情報を表示する。
         */

        const observer = new MutationObserver(function () {

            const table = document.getElementById(
                'table-earthquakes'
            );

            if (!table) return;

            const row = table.querySelector('tr');

            if (!row) return;

            const cells = row.querySelectorAll('td');

            if (cells.length < 6) return;


            document.getElementById(
                'summary-time'
            ).textContent = cells[0].textContent.trim();


            document.getElementById(
                'summary-epicenter'
            ).textContent = cells[1].textContent.trim();


            document.getElementById(
                'summary-latitude'
            ).textContent = cells[2].textContent.trim();


            document.getElementById(
                'summary-longitude'
            ).textContent = cells[3].textContent.trim();


            document.getElementById(
                'summary-depth'
            ).textContent = cells[4].textContent.trim();


            document.getElementById(
                'summary-magnitude'
            ).textContent = cells[5].textContent.trim();

        });


        observer.observe(
            document.getElementById('table-earthquakes'),
            {
                childList: true,
                subtree: true
            }
        );

    </script>

</body>

</html>
